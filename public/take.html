<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Опрос</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="page stack">
    <p class="error" data-error hidden></p>
    <form id="take" class="card stack" hidden>
      <h1 id="title"></h1>
      <p id="description" class="muted" hidden></p>
      <div id="fields" class="stack"></div>
      <label>Имя, если хотите представиться
        <input name="respondentName" maxlength="200">
      </label>
      <button class="primary" type="submit">Отправить</button>
    </form>
  </main>
  <script type="module" src="/js/take.js"></script>
</body>
</html>
